# ============================================================================
# Simplified tmux Configuration for Development
# ============================================================================

# Terminal Settings
set-option -sa terminal-overrides ",xterm*:Tc"  # True color support
set -g default-terminal "tmux-256color"          # Better color support
set -g mouse on                                  # Mouse support
set -g focus-events on                           # Focus events for editors
set -g escape-time 0                             # Faster key sequences

# Window and Pane Indexing
set -g base-index 1                              # Start windows at 1
set -g pane-base-index 1                         # Start panes at 1
set-window-option -g pane-base-index 1           # Ensure pane base index
set-option -g renumber-windows on                # Renumber windows automatically
set -g automatic-rename on                       # Rename windows automatically

# Prefix Key (Ctrl-t to avoid conflicts with Emacs keybindings)
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ============================================================================
# Key Bindings
# ============================================================================

# Pane Navigation
bind h select-pane -L                            # Move left
bind j select-pane -D                            # Move down
bind k select-pane -U                            # Move up
bind l select-pane -R                            # Move right

# Pane Splitting
bind | split-window -h -c "#{pane_current_path}" # Vertical split
bind - split-window -v -c "#{pane_current_path}" # Horizontal split
unbind '"'
unbind %

# Window Navigation (FIXED - these were missing!)
bind n next-window                               # Next window
bind p previous-window                           # Previous window
bind c new-window -c "#{pane_current_path}"      # New window in current path

# Session and Config
bind r command-prompt "rename-window %%"        # Rename window
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Copy Mode
set -g mode-keys emacs                           # Use Emacs keys in copy mode
bind Space copy-mode                             # Enter copy mode
bind v paste-buffer                              # Paste (changed from 'p' to avoid conflict)

# ============================================================================
# Plugins (Minimal Set)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Catppuccin Theme Configuration
set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_window_status_style "rounded"

# ============================================================================
# Settings
# ============================================================================

# History and Performance
set -g history-limit 50000                      # Larger scrollback
set -g status-interval 5                        # Update every 5 seconds
set -g bell-action none                          # Disable bell

# Initialize plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'