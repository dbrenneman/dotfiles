# ============================================================================
# tmux config. No plugins: theme and keys are native, so nothing to install.
# Colors are Catppuccin Macchiato to match Ghostty.
# ============================================================================

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"          # True color (covers xterm-ghostty)
set -g extended-keys on                          # Modified keys reach Helix
set -g allow-passthrough on                      # Image and escape passthrough
set -g focus-events on                           # Helix reloads files on focus
set -g escape-time 0
set -g mouse on
set -g history-limit 50000
set -g bell-action none
set -g aggressive-resize on
set -g detach-on-destroy off                     # Closing a session jumps to another

# Clipboard
set -g set-clipboard on
set -s copy-command "pbcopy"

# Indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl-t
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ============================================================================
# Keys
# ============================================================================

# Panes: move with h j k l, resize with H J K L (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Splits keep the current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Windows
bind n next-window
bind p previous-window
bind -r < swap-window -d -t -1                   # Move window left
bind -r > swap-window -d -t +1                   # Move window right
bind r command-prompt -I "#W" "rename-window '%%'"
bind z resize-pane -Z                            # Zoom (default, listed for clarity)
bind x kill-pane

# Sessions
bind s choose-tree -Zs                           # Session picker
bind N command-prompt -p "New session:" "new-session -s '%%'"

# Popups: full-screen tools without leaving the layout
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind C-k display-popup -E -w 90% -h 90% k9s
bind T display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Config
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Copy mode (emacs keys)
set -g mode-keys emacs
bind Space copy-mode
bind v paste-buffer
bind -T copy-mode M-w send -X copy-pipe-and-cancel

# ============================================================================
# Look: Catppuccin Macchiato
#   base #24273a  mantle #1e2030  surface0 #363a4f  overlay0 #6e738d
#   text #cad3f5  blue #8aadf4  mauve #c6a0f6  green #a6da95
#   peach #f5a97f  red #ed8796  lavender #b7bdf8
# ============================================================================

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e2030,fg=#cad3f5"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Left: session pill, red while the prefix is held
set -g status-left "#[fg=#{?client_prefix,#ed8796,#8aadf4},bg=#1e2030]#[fg=#1e2030,bg=#{?client_prefix,#ed8796,#8aadf4},bold] #S #[fg=#{?client_prefix,#ed8796,#8aadf4},bg=#1e2030] "

# Windows: rounded pills. Name is the directory, or the program when not a shell.
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
set -g window-status-separator " "
set -g window-status-format "#[fg=#363a4f,bg=#1e2030]#[fg=#a5adcb,bg=#363a4f] #I #W#{?window_flags,#{window_flags},} #[fg=#363a4f,bg=#1e2030]"
set -g window-status-current-format "#[fg=#c6a0f6,bg=#1e2030]#[fg=#1e2030,bg=#c6a0f6,bold] #I #W#{?window_flags,#{window_flags},} #[fg=#c6a0f6,bg=#1e2030]"
set -g window-status-activity-style "fg=#f5a97f"
set -g window-status-bell-style "fg=#ed8796"

# Right: host and clock
set -g status-right "#[fg=#6e738d] #H  #[fg=#b7bdf8]%a %b %d  #[fg=#a6da95,bold]%H:%M "

# Panes and messages
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g pane-border-lines heavy
set -g display-panes-colour "#6e738d"
set -g display-panes-active-colour "#f5a97f"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#a6da95"
set -g mode-style "bg=#494d64,fg=#cad3f5"
set -g popup-border-style "fg=#8aadf4"
set -g clock-mode-colour "#8aadf4"

# Terminal title
set -g set-titles on
set -g set-titles-string "#S: #W"
